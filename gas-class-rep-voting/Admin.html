<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin - Voting Results</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #0f172a;
        --accent: #22d3ee;
        --muted: #94a3b8;
        --radius: 14px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 24px; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial;
        min-height: 100vh; background: radial-gradient(1200px 600px at 10% -20%, rgba(34,211,238,.12), transparent),
          radial-gradient(1200px 600px at 90% 120%, rgba(34,211,238,.12), transparent), #020617;
        color: white; display: grid; place-items: center;
      }
      .card {
        width: 100%; max-width: 680px; background: linear-gradient(180deg, rgba(148,163,184,0.12), transparent);
        border: 1px solid rgba(148,163,184,0.25); border-radius: var(--radius); padding: 24px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 20px 60px rgba(2,6,23,.4);
        backdrop-filter: blur(8px);
      }
      h1 { font-size: 22px; margin: 0 0 12px; }
      p { color: var(--muted); margin-top: 0; }
      .row { display: grid; gap: 12px; }
      table { width: 100%; border-collapse: collapse; margin-top: 12px; }
      th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid rgba(148,163,184,0.2); }
      th { color: #e2e8f0; }
      .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; background: rgba(34,211,238,.15); color: #67e8f9; font-weight: 700; }
      .controls { display: flex; gap: 10px; align-items: center; }
      button { padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(148,163,184,0.25); background: rgba(148,163,184,0.08); color: white; cursor: pointer; }
      button:hover { background: rgba(148,163,184,0.15); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="controls">
        <h1>📊 Voting Results</h1>
        <button id="refreshBtn">Refresh</button>
      </div>
      <p>Shows the current total votes per candidate.</p>
      <div id="summary"></div>
      <table>
        <thead>
          <tr>
            <th>Candidate</th>
            <th>Votes</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <script>
      const tbody = document.getElementById('tbody');
      const summary = document.getElementById('summary');
      const refreshBtn = document.getElementById('refreshBtn');

      function render(results) {
        tbody.innerHTML = '';
        let total = 0;
        results.forEach(r => {
          total += r.votes;
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${r.candidate}</td><td><span class="badge">${r.votes}</span></td>`;
          tbody.appendChild(tr);
        });
        summary.innerHTML = `🧮 Total votes: <span class="badge">${total}</span>`;
      }

      function load() {
        google.script.run.withSuccessHandler(render).getResults();
      }

      refreshBtn.addEventListener('click', load);
      load();
    </script>
  </body>
</html>
